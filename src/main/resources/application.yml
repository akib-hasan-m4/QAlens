spring:
  application:
    name: qalens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/qalens}
    username: ${DB_USER:qalens}
    password: ${DB_PASSWORD:qalens}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-small-en-v1.5}
      init:
        pull-model-strategy: never

qalens:
  ai:
    timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
