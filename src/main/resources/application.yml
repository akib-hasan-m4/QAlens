spring:
  application:
    name: qalens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/qalens}
    username: ${DB_USER:qalens}
    password: ${DB_PASSWORD:qalens}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # timestamptz values come back in the server's zone instead of UTC, so pages show local times
      hibernate.timezone.default_storage: NORMALIZE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:granite4.1:3b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:all-minilm}
      init:
        pull-model-strategy: never

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: QALENS_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

qalens:
  ai:
    provider: ${QALENS_AI_PROVIDER:ollama}
    timeout: 90s
  impact:
    # cosine similarity below this is not suggested at all; a weighted score at or above run-first is "Run first"
    min-similarity: 0.35
    run-first: 0.5
    limit: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
