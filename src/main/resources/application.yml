spring:
  application:
    name: qalens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/qalens}
    username: ${DB_USER:qalens}
    password: ${DB_PASSWORD:qalens}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:granite4.1:3b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-small-en-v1.5}
      init:
        pull-model-strategy: never

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: QALENS_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

qalens:
  ai:
    provider: ${QALENS_AI_PROVIDER:ollama}
    timeout: 90s

management:
  endpoints:
    web:
      exposure:
        include: health,info
