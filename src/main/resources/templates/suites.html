<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Test suites')}"></head>
<body>
<main>
    <div class="crumbs">
        <a th:href="@{/o/{s}/projects(s=${slug})}">Projects</a> /
        <a th:href="@{/o/{s}/projects/{p}(s=${slug},p=${projectId})}">Project</a> / Suites
    </div>
    <h1>Test suites</h1>
    <div class="card">
        <p th:if="${#lists.isEmpty(suites)}">No suites yet.</p>
        <table th:unless="${#lists.isEmpty(suites)}">
            <tr><th>Suite</th></tr>
            <tr th:each="s : ${suites}">
                <td th:classappend="'depth-' + ${s.depth}">
                    <a th:href="@{/o/{s}/projects/{p}/suites/{id}(s=${slug},p=${projectId},id=${s.id})}"
                       th:text="${(s.depth > 0 ? '↳ ' : '') + s.name}">Suite</a>
                </td>
            </tr>
        </table>
    </div>
    <div class="card" th:if="${mayEdit}">
        <h3>New suite</h3>
        <form method="post" th:action="@{/o/{s}/projects/{p}/suites(s=${slug},p=${projectId})}" th:object="${form}">
            <div class="field">
                <label for="name">Name</label>
                <input class="input" id="name" type="text" th:field="*{name}" maxlength="200" required>
                <div class="alert err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Invalid</div>
            </div>
            <div class="field">
                <label for="parentId">Inside (optional)</label>
                <select id="parentId" name="parentId">
                    <option value="">Top level</option>
                    <option th:each="s : ${suites}" th:value="${s.id}"
                            th:text="${(s.depth > 0 ? '↳ ' : '') + s.name}"
                            th:selected="${form.parentId != null and form.parentId == s.id}">Suite</option>
                </select>
            </div>
            <button class="btn p" type="submit">Create suite</button>
        </form>
    </div>
</main>
</body>
</html>
