<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Requirement')}"></head>
<body th:replace="~{layout/base :: shell(~{::main}, 'requirements')}">
<main>
    <div class="crumbs">
        <a th:href="@{/o/{s}/projects/{p}(s=${slug},p=${projectId})}" th:text="${shell.project.name}">Project</a> /
        <a th:href="@{/o/{s}/projects/{p}/requirements(s=${slug},p=${projectId})}">Requirements</a> /
        <span th:text="${requirement.extKey != null} ? ${requirement.extKey} : ${'#' + requirement.id}">REQ-1</span>
    </div>
    <h1 id="requirement-title" th:text="${requirement.title}">Title</h1>
    <div class="sub">
        <span class="badge info" th:text="${requirement.status}">DRAFT</span>
        <span th:text="${requirement.priority}">MEDIUM</span> priority
    </div>
    <div class="card">
        <h3>Description</h3>
        <p id="requirement-body" th:text="${requirement.body}">Body</p>
    </div>
    <div class="card">
        <h3>Test cases</h3>
        <p id="no-cases" th:if="${#lists.isEmpty(linkedCases)}">No test case verifies this requirement yet.</p>
        <table id="linked-cases" th:unless="${#lists.isEmpty(linkedCases)}">
            <tr><th>Test case</th><th>Priority</th><th>Version</th></tr>
            <tr th:each="c : ${linkedCases}">
                <td><a th:href="@{/o/{s}/projects/{p}/cases/{id}(s=${slug},p=${projectId},id=${c.id})}"
                       th:text="${c.title}">Case</a></td>
                <td th:text="${c.priority}">MEDIUM</td>
                <td th:text="${'v' + c.versionNo}">v1</td>
            </tr>
        </table>
    </div>
    <div class="card" th:if="${mayEdit}">
        <h3>Edit requirement</h3>
        <form class="narrow" method="post"
              th:action="@{/o/{s}/projects/{p}/requirements/{id}(s=${slug},p=${projectId},id=${requirement.id})}"
              th:object="${form}">
            <div th:replace="~{requirement-fields :: fields}"></div>
            <button class="btn p" type="submit">Save</button>
        </form>
    </div>
</main>
</body>
</html>
