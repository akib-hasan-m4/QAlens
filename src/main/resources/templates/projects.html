<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Projects')}"></head>
<body th:replace="~{layout/base :: shell(~{::main}, 'projects')}">
<main>
    <div class="crumbs" th:text="${shell.orgName}">Acme Corp</div>
    <h1>Projects</h1>
    <div class="sub">Projects where you hold a role.</div>
    <div class="card">
        <p th:if="${#lists.isEmpty(projects)}">You have no projects yet.</p>
        <table th:unless="${#lists.isEmpty(projects)}">
            <tr><th>Key</th><th>Name</th><th>Your role</th></tr>
            <tr th:each="p : ${projects}">
                <td class="id" th:text="${p.key}">DEMO</td>
                <td><a th:href="@{/o/{s}/projects/{id}(s=${slug},id=${p.id})}" th:text="${p.name}">Name</a>
                    <span class="badge" th:if="${p.archived}">Archived</span></td>
                <td><span class="badge info" th:text="${p.myRole}">TESTER</span></td>
            </tr>
        </table>
    </div>
    <div class="card" th:if="${mayCreate}">
        <h3>New project</h3>
        <form class="narrow" method="post" th:action="@{/o/{s}/projects(s=${slug})}" th:object="${form}">
            <div class="field">
                <label for="name">Name</label>
                <input class="input" id="name" type="text" th:field="*{name}" maxlength="200" required>
                <div class="alert err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Invalid name</div>
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea class="input" id="description" th:field="*{description}" maxlength="2000" rows="3"></textarea>
                <div class="alert err" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Invalid</div>
            </div>
            <p class="sub">The project key is generated from the name.</p>
            <button class="btn p" type="submit">Create project</button>
        </form>
    </div>
</main>
</body>
</html>
