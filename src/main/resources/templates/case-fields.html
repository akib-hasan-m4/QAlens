<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="fields">
    <div class="field">
        <label for="title">Title</label>
        <input class="input" id="title" type="text" th:field="*{title}" maxlength="500" required>
        <div class="alert err" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Invalid</div>
    </div>
    <div class="field">
        <label for="precondition">Precondition</label>
        <textarea class="input" id="precondition" th:field="*{precondition}" maxlength="5000" rows="3"></textarea>
        <div class="alert err" th:if="${#fields.hasErrors('precondition')}" th:errors="*{precondition}">Invalid</div>
    </div>
    <div class="field">
        <label for="priority">Priority</label>
        <select id="priority" th:field="*{priority}">
            <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}">MEDIUM</option>
        </select>
        <div class="alert err" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}">Invalid</div>
    </div>
    <div class="field">
        <label>Steps</label>
        <div id="steps" class="steps">
            <div class="step-head"><span>#</span><span>Action</span><span>Expected result</span><span></span></div>
            <div class="step-row" th:each="st, i : *{editorRows()}">
                <span class="step-no" th:text="${i.count}">1</span>
                <input class="input" type="text" maxlength="1000" aria-label="Action"
                       th:name="|steps[${i.index}].action|" th:value="${st.action}">
                <input class="input" type="text" maxlength="1000" aria-label="Expected result"
                       th:name="|steps[${i.index}].expected|" th:value="${st.expected}">
                <button class="btn step-remove" type="button" aria-label="Remove step">Remove</button>
            </div>
        </div>
        <template id="step-template">
            <div class="step-row">
                <span class="step-no"></span>
                <input class="input" type="text" maxlength="1000" aria-label="Action" name="steps[__INDEX__].action">
                <input class="input" type="text" maxlength="1000" aria-label="Expected result" name="steps[__INDEX__].expected">
                <button class="btn step-remove" type="button" aria-label="Remove step">Remove</button>
            </div>
        </template>
        <button class="btn" id="step-add" type="button">Add step</button>
        <div class="alert err" th:if="${#fields.hasErrors('stepsValid')}" th:errors="*{stepsValid}">Invalid</div>
    </div>
    <script th:src="@{/js/steps.js}" defer></script>
</div>
</body>
</html>
