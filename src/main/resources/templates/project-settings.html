<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Project settings')}"></head>
<body>
<main>
    <div class="crumbs">
        <a th:href="@{/o/{s}/projects/{id}(s=${slug},id=${project.id})}" th:text="${project.key}">DEMO</a> / Settings
    </div>
    <h1>Project settings</h1>
    <div class="sub">Visible to ADMIN and QA_LEAD only.</div>
    <div class="card">
        <table>
            <tr><th>Key</th><td th:text="${project.key}"></td></tr>
            <tr><th>Name</th><td th:text="${project.name}"></td></tr>
            <tr><th>Archived</th><td th:text="${project.archived}"></td></tr>
            <tr><th>Your role</th><td th:text="${project.myRole}"></td></tr>
        </table>
    </div>
</main>
</body>
</html>
