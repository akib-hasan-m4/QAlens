services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-qalens}
      POSTGRES_USER: ${DB_USER:-qalens}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qalens}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qalens} -d ${DB_NAME:-qalens}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
